<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PathSnap Laptop 2 demo client</title>
<style>body{font:16px system-ui;max-width:1000px;margin:40px auto;padding:0 20px;background:#f3f6fa;color:#142334}input,button,select{padding:10px;margin:6px 4px;font:inherit}input{width:350px}section{background:white;padding:20px;border-radius:12px;margin:18px 0}table{border-collapse:collapse;width:100%}th,td{text-align:left;border-bottom:1px solid #ddd;padding:8px}pre{white-space:pre-wrap}.note{color:#805000}</style>
<h1>PathSnap • Laptop 2</h1><p>Connect this UI to the trained model and API running on Laptop 1.</p>
<section><label>Laptop 1 API URL <input id="base" placeholder="http://192.168.1.20:8000"></label><button id="connect">Connect & load trips</button><p id="status">Not connected</p></section>
<section><select id="trips" aria-label="Trip"></select><button id="score" disabled>Score selected trip</button><pre id="summary"></pre><p class="note">Real ML scores. HMM/Viterbi is not connected; these are independent observation arc predictions, not a reconstructed route.</p><table><thead><tr><th>Observation</th><th>Arc</th><th>Match probability</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section>
<script>
const el=id=>document.getElementById(id);el('base').value=localStorage.getItem('pathsnap-api')||'http://localhost:8000';
async function request(path,options){let base=el('base').value.trim().replace(/\/$/,'');let response=await fetch(base+path,options);if(!response.ok)throw Error(`HTTP ${response.status}: ${await response.text()}`);return response.json();}
el('connect').onclick=async()=>{el('score').disabled=true;try{el('status').textContent='Connecting…';let h=await request('/healthz');if(h.is_fixture||!h.model_loaded)throw Error('Real model is not ready');let list=await request('/v1/pathsnap/trips');el('trips').replaceChildren(...list.trips.map(t=>new Option(t.trip_id,t.trip_id)));el('status').textContent=`Connected to real Random Forest • ${list.trips.length} trips`;el('score').disabled=!list.trips.length;localStorage.setItem('pathsnap-api',el('base').value);}catch(e){el('status').textContent=e.message+' — check Laptop 1 address, Wi-Fi, CORS and firewall.';}};
el('score').onclick=async()=>{el('score').disabled=true;el('summary').textContent='Scoring…';try{let r=await request('/v1/pathsnap/trips/'+encodeURIComponent(el('trips').value)+'/score',{method:'POST'});el('summary').textContent=`Trip ${r.trip_id}: ${r.observation_count} observations, ${r.candidate_count} candidates\n${r.elapsed_seconds.toFixed(2)} seconds • ${r.model} • fixture=${r.is_fixture}`;el('rows').replaceChildren(...r.predictions.slice(0,200).map(p=>{let tr=document.createElement('tr');for(let v of [p.obs_idx,p.arc_id??'—',p.emission_probability?.toFixed(4)??'—',p.status]){let td=document.createElement('td');td.textContent=v;tr.append(td);}return tr;}));}catch(e){el('summary').textContent=e.message;}finally{el('score').disabled=false;}};
</script></html>
